<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="찾아줘">
<link rel="manifest" href="/api/manifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<title>QR 포스터</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  body { background: #e8e8ed; color: #1d1d1f; color-scheme: light; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: rgba(255,255,255,.8);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: .5px solid rgba(0,0,0,.1); font-size: 15px; }
  .bar label { display: flex; align-items: center; gap: 8px; }
  .sheetA4 { width: 210mm; height: 297mm; margin: 24px auto; border-radius: 0; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.15); position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; padding: 16mm 18mm 13mm; text-align: center; }
  .p-head { align-self: stretch; margin: -16mm -18mm 0; padding: 14mm 18mm 11mm; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(160deg, #3d9bff 0%, #0063d1 70%); border-radius: 0 0 14mm 14mm; }
  .sheetA4 > * { position: relative; z-index: 1; }
  /* 머리: 왼쪽 큰 '찾아줘' · 오른쪽 학교/부서 */
  .p-top { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 8mm; margin-bottom: 9mm; }
  .p-brand { color: #fff; font-size: 46pt; font-weight: 900; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
  .p-org { text-align: right; color: #fff; font-size: 20pt; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; min-width: 0; }
  .p-org span { display: block; opacity: .92; }
  .p-title { color: #fff; font-size: 36pt; font-weight: 900; letter-spacing: -0.04em; line-height: 1.12; margin: 4mm 0 0; }
  /* 등록용 포스터: 설정 화면의 아이콘과 같은 주황색으로 구분 */
  .sheetA4.drop-poster .p-head { background: linear-gradient(160deg, #ffb340 0%, #ff9500 45%, #f07800 100%); }
  .sheetA4.drop-poster .qr-card { box-shadow: 0 10mm 30mm rgba(150, 70, 0, .22); }
  .sheetA4.drop-poster .step .n { background: #ff9500; }
  .qr-card { margin-top: 10mm; background: #fff; border-radius: 9mm; padding: 8mm; box-shadow: 0 10mm 30mm rgba(0, 40, 100, .25); }
  .qr-card svg { width: 58mm; height: 58mm; display: block; }
  .scan { margin-top: 6mm; font-size: 17pt; font-weight: 700; display: flex; gap: 3mm; align-items: center; }
  .url { font-size: 12pt; color: #6e6e73; margin-top: 1.5mm; }
  .code { margin-top: 7mm; display: inline-flex; flex-direction: column; align-items: center; background: #f5f5f7; border-radius: 6mm; padding: 4mm 12mm; }
  .code small { font-size: 11pt; color: #6e6e73; font-weight: 600; }
  .code b { font-size: 28pt; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; margin-top: auto; padding-top: 8mm; width: 100%; }
  .step { text-align: left; }
  .step .n { width: 9mm; height: 9mm; border-radius: 50%; background: #0071e3; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12pt; }
  .step b { display: block; font-size: 13pt; margin-top: 3mm; }
  .step > span { font-size: 10.5pt; color: #6e6e73; line-height: 1.45; display: block; margin-top: 1mm; }
  .p-foot { margin-top: 7mm; font-size: 10pt; color: #86868b; }
  @media print { body { background: #fff; } .bar { display: none; } .sheetA4 { margin: 0; box-shadow: none; } }
  /* 휴대폰: A4 한 장이 화면 폭에 딱 맞게 축소 (배율은 아래 스크립트가 계산). 인쇄할 때는 원래 크기 */
  @media screen { .sheetA4 { zoom: var(--fit, 1); } }
</style>
</head>
<body>
<div class="bar">
  <label><span class="switch"><input type="checkbox" id="showCode" checked><span></span></span>입장 코드 표시</label>
  <button class="btn primary" id="print">인쇄하기</button>
  <span data-admin-slot class="hidden"></span>
</div>
<div class="sheetA4">
  <div class="p-head">
    <div class="p-top">
      <div class="p-brand" data-site>찾아줘</div>
      <div class="p-org"><span data-school></span><span data-dept></span></div>
    </div>
    <div class="p-title" id="pTitle">물건을 잃어버렸나요?<br>여기서 먼저 찾아보세요</div>
  </div>
  <div class="qr-card" id="qr"></div>
  <div class="scan" id="scan"></div>
  <div class="url" id="url"></div>
  <div class="code" id="codeBox"><small>입장 코드</small><b id="code"></b></div>
  <div class="steps">
    <div class="step"><div class="n">1</div><b id="s1b">QR 찍고 입장</b><span id="s1">휴대폰 카메라로 QR을 찍고 입장 코드를 입력해요.</span></div>
    <div class="step"><div class="n">2</div><b id="s2b">사진으로 확인</b><span id="s2">주인을 기다리는 물건을 사진으로 확인해요.</span></div>
    <div class="step"><div class="n">3</div><b id="s3b">“내 것 같아요”</b><span id="s3">신청하고 <span data-dept></span>에 오면 바로 돌려받아요.</span></div>
  </div>
  <div class="p-foot" id="pFoot">잃어버린 물건이 아직 없다면 ‘분실 신고’를 남겨 두세요. 비슷한 물건이 들어오면 알려 드려요.</div>
</div>
<script src="/vendor/qrcode.js"></script>
<script>
// 화면 폭에 맞춰 포스터 축소 (210mm ≈ 794px, 양옆 16px 여백)
function fitSheet() { document.documentElement.style.setProperty('--fit', Math.min(1, (document.documentElement.clientWidth - 32) / 794)); }
fitSheet(); addEventListener('resize', fitSheet);
</script>
<script type="module">
import { api, $, esc, icon, boot } from '/common.js';
const { me, config } = await boot();
// ?type=drop 이면 교무실 책상용 '주운 물건 직접 등록' 포스터
const isDrop = new URLSearchParams(location.search).get('type') === 'drop';
let url = location.origin + '/';
let settings = null;
if (me.role === 'admin') { try { settings = await api('/api/admin/settings'); } catch { /* 무시 */ } }
if (isDrop) {
  if (!settings) { document.body.innerHTML = '<p style="padding:40px;text-align:center">관리자로 로그인해야 만들 수 있어요.</p>'; throw new Error('admin only'); }
  url = `${location.origin}/drop?k=${settings.drop.token}`;
  document.title = '등록용 QR 포스터';
  $('.sheetA4').classList.add('drop-poster');
  $('#pTitle').innerHTML = '물건을 주웠나요?<br>여기서 직접 등록해요';
  $('#s1b').textContent = 'QR 찍기'; $('#s1').textContent = '비밀번호 없이 바로 등록 화면이 열려요.';
  $('#s2b').textContent = '사진 · 장소 입력'; $('#s2').textContent = '사진을 찍고 품목과 주운 곳을 골라요.';
  $('#s3b').textContent = '선생님께 전달'; $('#s3').innerHTML = `물건을 ${esc(config.deptName)} 선생님께 건네주면 끝!`;
  $('#pFoot').textContent = '학번과 이름은 선생님만 볼 수 있어요. 주인을 찾아 줘서 고마워요!';
  $('#showCode').closest('label').classList.add('hidden');
}
const qr = qrcode(0, 'M');
qr.addData(url); qr.make();
$('#qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
$('#scan').innerHTML = `${icon('camera')}카메라로 찍어 보세요`;
$('#url').textContent = location.host;
let code = isDrop ? '' : settings?.authMode === 'password' ? settings.studentCode : '';
$('#code').textContent = code;
if (isDrop && settings.drop.meritEnabled) {
  code = 'merit';
  $('#codeBox').innerHTML = `<small>주인을 찾아 주면</small><b>🏅 상점 ${settings.drop.meritPoints}점</b>`;
}
const sync = () => $('#codeBox').classList.toggle('hidden', !$('#showCode').checked || !code);
$('#showCode').addEventListener('change', sync); sync();
if (!code || isDrop) $('#showCode').closest('label').classList.add('hidden');
$('#print').addEventListener('click', () => print());
</script>
</body>
</html>
