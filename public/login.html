<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="찾아줘">
<link rel="manifest" href="/api/manifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<title>찾아줘</title>
<style>
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login { width: 100%; max-width: 400px; text-align: center; animation: popIn .6s var(--spring); }
  .big-icon { width: 104px; height: 104px; border-radius: 30px; margin: 0 auto 24px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(160deg, #3d9bff 0%, #0063d1 100%); box-shadow: 0 16px 40px rgba(0, 99, 209, .35), inset 0 0 0 .5px rgba(255,255,255,.3); }
  .big-icon .i { width: 50px; height: 50px; stroke-width: 2.2; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 10px; }
  .sub { color: var(--label-2); font-size: 17px; margin: 0 0 36px; }
  .code-field { position: relative; }
  .code-field input { width: 100%; height: 60px; border-radius: 999px; border: 0; padding: 0 64px 0 26px; font-size: 19px; outline: none; background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--sep), 0 8px 26px rgba(30, 50, 90, .07); transition: box-shadow .2s; }
  .code-field input:focus { box-shadow: inset 0 0 0 1.5px var(--blue), 0 0 0 4px var(--blue-tint); }
  .code-field button { position: absolute; right: 9px; top: 9px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label-2);
    display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s; }
  .code-field input:not(:placeholder-shown) + button { background: var(--blue); color: #fff; }
  .code-field button .i { width: 20px; height: 20px; stroke-width: 2.4; }
  .code-field.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  #err { color: var(--red); font-size: 14px; min-height: 22px; margin: 12px 0 0; }
  .help { font-size: 13px; color: var(--label-2); margin-top: 28px; line-height: 1.6; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  footer { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--label-3); }
</style>
</head>
<body>
<main class="login">
  <div class="big-icon" id="bigIcon"></div>
  <h1 data-site>찾아줘</h1>
  <p class="sub" id="domainHint"><span data-school></span> 분실물, 여기서 찾아보세요.</p>
  <div id="gbtn" class="hidden"></div>
  <form id="pw" class="hidden">
    <div class="code-field" id="codeField">
      <input type="password" name="code" required autocomplete="current-password" placeholder="입장 코드" aria-label="입장 코드" autofocus>
      <button aria-label="들어가기" id="goBtn"></button>
    </div>
    <p id="err" role="alert"></p>
    <p class="help">입장 코드는 학교 게시판과 포스터에 있어요.<br>선생님은 관리자 비밀번호를 입력하세요.</p>
  </form>
  <form id="dev" class="hidden" style="text-align:left;margin-top:16px">
    <p class="muted small">개발 모드: 구글 로그인 없이 이메일로 로그인합니다.</p>
    <input class="field" type="email" name="email" required placeholder="student@school.kr">
    <button class="btn primary large" style="margin-top:10px">로그인</button>
  </form>
</main>
<footer><span data-school></span> <span data-dept></span></footer>
<script type="module">
import { api, $, $$, icon, fillNames } from '/common.js';
$('#bigIcon').innerHTML = icon('search');
$('#goBtn').innerHTML = icon('arrow-up-right');
const config = await api('/api/config');
document.title = `${config.siteName} · ${config.schoolName}`;
const params = new URLSearchParams(location.search);
const next = /^\/(?!\/)/.test(params.get('next') || '') ? params.get('next') : '/';
fillNames(config);
const done = role => (location.href = role === 'admin' && next === '/' ? '/admin' : next);
const showErr = e => {
  $('#err').textContent = e.message;
  const f = $('#codeField'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
};

if (config.authMode === 'password') {
  $('#pw').classList.remove('hidden');
  $('#pw').addEventListener('submit', async e => {
    e.preventDefault();
    $('#err').textContent = '';
    try { const r = await api('/api/auth/password', { method: 'POST', body: { code: e.target.code.value } }); done(r.role); }
    catch (err) { showErr(err); e.target.code.select(); }
  });
} else {
  $('#gbtn').classList.remove('hidden');
  if (config.allowedDomains.length) $('#domainHint').textContent = `@${config.allowedDomains.join(', @')} 계정으로 로그인하세요.`;
  googleLogin();
}

if (config.devLogin && config.authMode === 'google') {
  $('#dev').classList.remove('hidden');
  $('#dev').addEventListener('submit', async e => {
    e.preventDefault();
    try { await api('/api/auth/dev', { method: 'POST', body: { email: e.target.email.value } }); done(); }
    catch (err) { $('#err').textContent = err.message; }
  });
}

function googleLogin() {
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    google.accounts.id.initialize({
      client_id: config.googleClientId,
      hd: config.allowedDomains[0],
      callback: async ({ credential }) => {
        try { await api('/api/auth/google', { method: 'POST', body: { credential } }); done(); }
        catch (err) { $('#err').textContent = err.message; }
      },
    });
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ko' });
  };
  document.head.append(s);
}
</script>
</body>
</html>
